name: guardian-labs-landing

# Local image build for the Guardian Labs landing page.
# The shared Traefik instance is managed by the Guardian Seal stack and reaches
# this container through the external `proxy` network.

networks:
  proxy:
    external: true
    name: proxy

services:
  landing:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: guardian-labs-landing
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
