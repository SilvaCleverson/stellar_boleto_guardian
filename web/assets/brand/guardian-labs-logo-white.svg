<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="Guardian Seal">
  <title>Guardian Seal</title>

  <!-- Mark (mono white version) -->
  <g transform="translate(20, 20) scale(0.833)">
    <circle cx="120" cy="120" r="118" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>
    <circle cx="120" cy="120" r="112" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="120" cy="120" r="104" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="120" cy="120" r="98" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.7"/>
    <circle cx="120" cy="22" r="2.5" fill="#FFFFFF"/>
    <circle cx="120" cy="218" r="2.5" fill="#FFFFFF"/>
    <circle cx="22" cy="120" r="2.5" fill="#FFFFFF"/>
    <circle cx="218" cy="120" r="2.5" fill="#FFFFFF"/>
    <path d="M 100 95 V 82 a 20 20 0 0 1 40 0 V 95" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <rect x="86" y="92" width="68" height="58" rx="6" fill="#FFFFFF"/>
