  <!-- Tagline -->
  <text x="240" y="210" font-family="'Inter', sans-serif" font-weight="500" font-size="13" letter-spacing="3" fill="#FFFFFF" opacity="0.7">THE TRUST SEAL FOR DIGITAL RECORDS</text>
