<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Guardian Seal mark">
  <title>Guardian Seal</title>

  <!-- subtle outermost ring -->
  <circle cx="120" cy="120" r="118" fill="none" stroke="#D4AF37" stroke-width="0.5" opacity="0.6"/>

  <!-- navy disc -->
  <circle cx="120" cy="120" r="112" fill="#0A1F44"/>

  <!-- gold outer ring -->
  <circle cx="120" cy="120" r="104" fill="none" stroke="#D4AF37" stroke-width="2"/>

  <!-- gold inner thin ring -->
  <circle cx="120" cy="120" r="98" fill="none" stroke="#D4AF37" stroke-width="0.8"/>

  <!-- cardinal-point ornamental dots -->
  <circle cx="120" cy="22" r="2.5" fill="#D4AF37"/>
  <circle cx="120" cy="218" r="2.5" fill="#D4AF37"/>
  <circle cx="22" cy="120" r="2.5" fill="#D4AF37"/>
  <circle cx="218" cy="120" r="2.5" fill="#D4AF37"/>

  <!-- diagonal small accent stars -->
  <circle cx="50" cy="50" r="1.3" fill="#D4AF37" opacity="0.7"/>
  <circle cx="190" cy="50" r="1.3" fill="#D4AF37" opacity="0.7"/>
  <circle cx="50" cy="190" r="1.3" fill="#D4AF37" opacity="0.7"/>
  <circle cx="190" cy="190" r="1.3" fill="#D4AF37" opacity="0.7"/>

  <!-- padlock shackle -->
  <path d="M 100 95 V 82 a 20 20 0 0 1 40 0 V 95" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>

  <!-- padlock body -->
  <rect x="86" y="92" width="68" height="58" rx="6" fill="#D4AF37"/>

  <!-- G letter on the lock body -->
  <text x="120" y="138" text-anchor="middle"
        font-family="'Cormorant Garamond', 'Garamond', Georgia, serif"
        font-weight="600" font-size="48" font-style="italic" fill="#0A1F44">G</text>

  <!-- SEAL text below the lock -->
  <text x="120" y="178" text-anchor="middle"
        font-family="'Inter', system-ui, sans-serif" font-weight="600"
        font-size="11" letter-spacing="5" fill="#D4AF37">SEAL</text>
</svg>
